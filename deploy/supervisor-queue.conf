; /etc/supervisor/conf.d/motogrip-queue.conf
[program:motogrip-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/motogrip/current/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/motogrip-queue.log
stopwaitsecs=3600
