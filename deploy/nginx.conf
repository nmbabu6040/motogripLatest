# /etc/nginx/sites-available/motogrip.conf  (replace example.com and the PHP socket)
server {
    listen 80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;

    # Certificates, e.g. from certbot: certbot --nginx -d example.com -d www.example.com
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Only Laravel's public directory is served. Source, .env, storage and backups stay outside the web root.
    root /var/www/motogrip/current/public;
    index index.php;
    client_max_body_size 25M;   # PDFs up to 20 MB

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:css|js|woff2|webp|png|jpg|jpeg|svg|ico)$ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
